[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watkins-lab"
version = "0.1.0"
description = "A learning lab for passive sonar signal analysis and classification of marine mammal vocalizations (Watkins Marine Mammal Sound Database) with CNNs, transfer learning, and AST."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
