# AST linear probe on a GPU. The head training is trivial either way --
# what changes here is the one-time frozen-backbone embedding extraction
# pass, which is the entire cost of this path and which mixed precision
# plus a larger extraction batch speed up substantially.
#
#   python -m watkins.train --config configs/gpu/ast_linear_probe.yaml
#
# Worth running before ast_finetune.yaml: it gives you the probe baseline
# to compare full fine-tuning against, for a couple of minutes of GPU time.
run_name: ast_linear_probe_gpu
model: ast
model_kwargs:
  freeze_backbone: true
batch_size: 64          # only affects embedding-extraction batching, not training
epochs: 200             # cheap: training the head is a full-batch GD step per "epoch"
lr: 0.01
weight_decay: 0.0001
optimizer: adamw
train_augment: false    # embeddings are cached, so inputs must be deterministic
spec_augment: false
noise_augment_p: 0.0
class_weighted_loss: true
seed: 42
patience: 20
num_workers: 8
amp: auto
